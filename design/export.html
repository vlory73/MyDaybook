.drow { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: var(--tap); padding: 0 var(--sp-4); border-radius: var(--r-md); background: var(--surface-2); font-weight: var(--fw-semibold); }

.inside li > span:last-child { padding-top: 5px; }
.trow { display: flex; align-items: center; gap: var(--sp-3); }
.trow .t { font-weight: var(--fw-semibold); }
.trow.dis { opacity: .55; }
.toggle { width: 51px; height: 31px; border-radius: 16px; background: var(--meds-ink); position: relative; flex: none; }

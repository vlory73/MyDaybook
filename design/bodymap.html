<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Body map: MyDaybook mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<style>
.body .rg { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.2; }
.body .rg.sel { fill: var(--primary-soft); stroke: var(--primary); stroke-width: 2; }
.body .h1 { fill: var(--heat-1); } .body .h2 { fill: var(--heat-2); } .body .h3 { fill: var(--heat-3); }
.body .h4 { fill: var(--heat-4); } .body .h5 { fill: var(--heat-5); } .body .h6 { fill: var(--heat-6); }
.body .pt-halo { fill: var(--surface); opacity: .9; }
.body .pt { stroke: var(--surface); stroke-width: 1.5; }
.body .pt-1 { fill: var(--heat-2); } .body .pt-2 { fill: var(--heat-3); } .body .pt-3 { fill: var(--heat-4); }
.body .pt-4 { fill: var(--heat-5); } .body .pt-5, .body .pt-6 { fill: var(--heat-6); }

.stage { position: relative; display: flex; justify-content: center; margin-top: var(--sp-2); }
.side { position: absolute; top: 8px; line-height: 1.25; font-size: var(--fs-caption); font-weight: var(--fw-bold); letter-spacing: .06em; color: var(--text-3); }
.zooms { position: absolute; right: 0; bottom: 6px; display: flex; flex-direction: column; gap: 8px; }
.zooms .chip { min-height: 34px; font-size: var(--fs-footnote); padding: 0 10px; }
.ramp { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin-top: 6px; }
.ramp span { height: 34px; border-radius: 8px; display: grid; place-items: center; font-size: var(--fs-footnote); font-weight: var(--fw-semibold); }
.ramp span.on { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text); }
</style>
</head>
<body>
<div class="phone">
<div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sys">
<span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
<span class="batt"></span></span></div>

<main class="content" style="padding-bottom:0">
  <div class="nav-head"><button class="icon-btn" aria-label="Back"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg></button>
    <span class="title">Where does it hurt?</span><button class="icon-btn" aria-label="Help"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#info"/></svg></button></div>
  <div style="display:flex; gap:var(--sp-2); align-items:center">
    <div class="segmented" role="tablist" style="flex:1"><button class="on" role="tab" aria-selected="true">Front</button><button role="tab">Back</button></div>
    <button class="btn btn-quiet btn-sm" style="border-radius:var(--r-full); min-height:42px"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#search"/></svg> Find</button></div>
  <div class="stage">
    <span class="side" style="left:0">YOUR<br>RIGHT</span><span class="side" style="right:0; text-align:right">YOUR<br>LEFT</span>
    <svg class="body" viewBox="0 0 200 440" width="186" role="img" aria-label="Body, front view"><ellipse cx="100" cy="36" rx="21" ry="25" class="rg" data-region="head"><title>Head</title></ellipse><rect x="91" y="63" width="18" height="13" rx="5" class="rg" data-region="neck"><title>Neck</title></rect><ellipse cx="66" cy="89" rx="13" ry="12" class="rg" data-region="shoulder-right"><title>Your right shoulder</title></ellipse><ellipse cx="134" cy="89" rx="13" ry="12" class="rg" data-region="shoulder-left"><title>Your left shoulder</title></ellipse><rect x="75" y="79" width="23.5" height="48" rx="12" class="rg" data-region="chest-right"><title>Right side of chest</title></rect><rect x="101.5" y="79" width="23.5" height="48" rx="12" class="rg" data-region="chest-left"><title>Left side of chest</title></rect><rect x="74" y="131" width="52" height="38" rx="10" class="rg" data-region="upper-abdomen"><title>Upper abdomen</title></rect><rect x="76" y="172" width="48" height="32" rx="10" class="rg" data-region="lower-abdomen"><title>Lower abdomen</title></rect><rect x="72" y="207" width="26" height="30" rx="10" class="rg" data-region="hip-right"><title>Your right hip</title></rect><rect x="102" y="207" width="26" height="30" rx="10" class="rg" data-region="hip-left"><title>Your left hip</title></rect><rect x="74" y="240" width="24" height="74" rx="11" class="rg" data-region="thigh-right"><title>Your right thigh</title></rect><rect x="102" y="240" width="24" height="74" rx="11" class="rg" data-region="thigh-left"><title>Your left thigh</title></rect><rect x="75" y="317" width="22" height="22" rx="10" class="rg sel" data-region="knee-right"><title>Your right knee</title></rect><rect x="103" y="317" width="22" height="22" rx="10" class="rg" data-region="knee-left"><title>Your left knee</title></rect><rect x="76" y="342" width="20" height="62" rx="9" class="rg" data-region="shin-right"><title>Your right shin</title></rect><rect x="104" y="342" width="20" height="62" rx="9" class="rg" data-region="shin-left"><title>Your left shin</title></rect><rect x="68" y="407" width="28" height="16" rx="8" class="rg" data-region="foot-right"><title>Your right foot</title></rect><rect x="104" y="407" width="28" height="16" rx="8" class="rg" data-region="foot-left"><title>Your left foot</title></rect><g transform="rotate(6 57 104)"><rect x="49.0" y="104" width="17" height="54" rx="8.5" class="rg" data-region="upper-arm-right"><title>Your right upper arm</title></rect><rect x="49.0" y="161" width="17" height="14" rx="7" class="rg" data-region="elbow-right"><title>Your right elbow</title></rect><rect x="49.5" y="178" width="16" height="42" rx="8" class="rg" data-region="forearm-right"><title>Your right forearm</title></rect><rect x="48.0" y="223" width="19" height="30" rx="9" class="rg" data-region="hand-right"><title>Your right hand</title></rect></g><g transform="rotate(-6 143 104)"><rect x="134.0" y="104" width="17" height="54" rx="8.5" class="rg" data-region="upper-arm-left"><title>Your left upper arm</title></rect><rect x="134.0" y="161" width="17" height="14" rx="7" class="rg" data-region="elbow-left"><title>Your left elbow</title></rect><rect x="134.5" y="178" width="16" height="42" rx="8" class="rg" data-region="forearm-left"><title>Your left forearm</title></rect><rect x="133.0" y="223" width="19" height="30" rx="9" class="rg" data-region="hand-left"><title>Your left hand</title></rect></g><circle cx="86" cy="328" r="9" class="pt-halo"/><circle cx="86" cy="328" r="5.5" class="pt pt-4"/><circle cx="135" cy="88" r="9" class="pt-halo"/><circle cx="135" cy="88" r="5.5" class="pt pt-2"/></svg>
    <div class="zooms"><span class="chip"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#scan-face"/></svg> Head</span><span class="chip"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#hand"/></svg> Hands</span>
      <span class="chip"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#footprints"/></svg> Feet</span></div>
  </div>
</main>
<section class="sheet" aria-labelledby="pt" style="box-shadow: 0 -6px 24px rgb(0 0 0 / .10); padding-bottom: calc(var(--safe-bottom) + var(--sp-2))">
  <div class="grabber"></div>
  <div class="sheet-head" style="margin-bottom:var(--sp-2)"><h2 id="pt">Your right knee</h2>
    <span class="muted small">Point 1 of 2</span></div>
  <div class="ramp" role="radiogroup" aria-label="Intensity, 0 none to 10 worst imaginable"><span class="" style="background:var(--heat-0);color:var(--text)">0</span><span class="" style="background:var(--heat-1);color:var(--text)">1</span><span class="" style="background:var(--heat-1);color:var(--text)">2</span><span class="" style="background:var(--heat-2);color:var(--text)">3</span><span class="" style="background:var(--heat-2);color:var(--text)">4</span><span class="" style="background:var(--heat-3);color:var(--text)">5</span><span class="on" style="background:var(--heat-3);color:var(--text)">6</span><span class="" style="background:var(--heat-4);color:var(--on-heat-hi)">7</span><span class="" style="background:var(--heat-5);color:var(--on-heat-hi)">8</span><span class="" style="background:var(--heat-5);color:var(--on-heat-hi)">9</span><span class="" style="background:var(--heat-6);color:var(--on-heat-hi)">10</span></div>
  <div class="scroll-row" style="margin-top:var(--sp-3)"><span class="chip">Sharp</span><span class="chip">Dull</span><span class="chip">Burning</span><span class="chip">Throbbing</span><span class="chip on">Aching</span><span class="chip">Tingling</span><span class="chip">Other</span></div>
  <div style="display:flex; gap:var(--sp-3); margin-top:var(--sp-4)">
    <button class="btn btn-quiet" style="flex:1; white-space:nowrap"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#plus"/></svg> Point</button>
    <button class="btn btn-primary" style="flex:2">Save 2 points</button></div>
</section>

<div class="home-indicator"></div>
</div>
</body>
</html>

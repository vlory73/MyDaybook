body.board { padding: 24px; min-height: 0; width: max-content; }
.board-title { font-size: 22px; font-weight: var(--fw-bold); }
.board-sub { color: var(--text-2); margin: 4px 0 24px; font-size: var(--fs-callout); }
.row { display: flex; gap: 32px; align-items: flex-start; width: max-content; }
.row + .row { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
.frame { margin: 0; width: 375px; }
.phone-wrap { border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), var(--shadow-2); background: var(--bg); }
.frame figcaption { margin-top: 12px; font-size: var(--fs-footnote); color: var(--text-2); line-height: 1.4; }
.frame figcaption b { color: var(--text); }
.frame.dark figcaption { color: #5f5666; } .frame.dark figcaption b { color: #2a2430; }
.frame.dark { color: var(--text); }
.statusbar { position: relative; z-index: 60; }
.hint { margin: var(--sp-2) 0 0; }
.row2 { display: flex; gap: var(--sp-2); } .row2 .btn { flex: 1; }
.sum { text-align: center; padding: var(--sp-3) 0 var(--sp-4); }
.sum .big { font-size: var(--fs-display); font-weight: var(--fw-bold); line-height: 1.1; }
.times { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.tcard { background: var(--sleep-tint); color: var(--sleep-ink); border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-4); }
.tcard .v { font-size: var(--fs-title2); font-weight: var(--fw-bold); color: var(--text); }
.tcard .k { display: flex; gap: 6px; align-items: center; font-size: var(--fs-footnote); font-weight: var(--fw-semibold); }
.scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.scale button { height: 46px; border-radius: var(--r-md); background: var(--surface-2); color: var(--text-2); font-weight: var(--fw-semibold); }
.scale button.on { background: var(--sleep-tint); color: var(--sleep-ink); box-shadow: inset 0 0 0 2px var(--sleep-ink); }
.ends { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--text-3); margin-top: 4px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 46px 40px 1fr; gap: var(--sp-3); align-items: start; padding: 10px 0; }
.tl time { font-size: var(--fs-footnote); color: var(--text-2); padding-top: 10px; font-weight: var(--fw-medium); }
.tl .t { font-weight: var(--fw-semibold); } .tl .s { font-size: var(--fs-callout); color: var(--text-2); }
.cat-nap { background: color-mix(in srgb, var(--sleep-tint) 55%, var(--surface)); }
.chart { display: block; width: 100%; height: auto; margin-top: var(--sp-3); overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 4; }
.chart .tick { stroke: var(--text-3); stroke-width: 1; }
.chart .ax { font-size: 11px; fill: var(--text-2); font-family: var(--font-sans); }
.chart .sbar { fill: var(--sleep-ink); opacity: .85; }
.chart .ndot { fill: var(--surface); stroke: var(--sleep-ink); stroke-width: 2; }
.napsum { display: flex; gap: var(--sp-3); align-items: center; margin-top: var(--sp-4); padding-top: var(--sp-3); border-top: 1px solid var(--line); font-size: var(--fs-callout); }
.dark {

    --surface-2: #2a2530;

    --sleep-tint: #252c45; --sleep-ink: #b5c3f2;
    --measure-tint: #1e3141; --measure-ink: #a8d2ef;
    --pain-tint: #3e2329;  --pain-ink: #f5b0b6;
    --meds-tint: #1f3329;  --meds-ink: #a9dabd;
    --note-tint: #34301f;  --note-ink: #e4d4a7;
    --gut-tint: #2b3120;   --gut-ink: #c9d89a;
    --heat-0: #2a2530;
    --heat-1: #4a3428;
    --heat-2: #7a4a34;
    --heat-3: #b0603f;
    --heat-4: #dc7a5c;
    --heat-5: #f0a07f;
    --heat-6: #fbd0b3;
    --on-heat-hi: #2b1309;
    --on-heat-1: #f4eff2;
    --on-heat-2: #f4eff2;
    --on-heat-3: #ffffff;
    --on-heat-4: #16101a;
    --on-heat-5: #16101a;
    --shadow-1: 0 1px 2px rgb(0 0 0 / 0.3);
    --shadow-2: 0 6px 18px rgb(0 0 0 / 0.45);
    --shadow-fab: 0 6px 18px rgb(240 143 104 / 0.25), 0 2px 4px rgb(0 0 0 / 0.4);
}

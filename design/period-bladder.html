<style>:root { --period-tint:#f3dcf0; --period-ink:#7d2a78; --period-mark:#a63a9f; --bladder-tint:#f6eebf; --bladder-ink:#5f5000; --bladder-mark:#8a6f00; }

body.board { padding: 24px; min-height: 0; width: max-content; }

.row { display: flex; gap: 32px; align-items: flex-start; width: max-content; } .row + .row { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
.frame { margin: 0; width: 375px; } .phone-wrap { border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), var(--shadow-2); background: var(--bg); }

.frame.dark figcaption { color: #5f5666; } .frame.dark figcaption b { color: #2a2430; } .frame.dark { color: var(--text); }
.statusbar { position: relative; z-index: 60; }
:root { --drink-tint: #d9ecee; --drink-ink: #1f5f66; }
.cat-drink { background: var(--drink-tint); color: var(--drink-ink); }
.toggle { width: 51px; height: 31px; border-radius: 16px; background: var(--surface-3); position: relative; flex: none; }
.toggle::after { content: ''; position: absolute; left: 2px; top: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: var(--shadow-1); }
.toggle:disabled { opacity: .5; } .toggle.on { background: var(--meds-ink); } .toggle.on::after { transform: translateX(20px); }

.tlist { list-style: none; margin: 0; padding: 0; } .tlist li + li { border-top: 1px solid var(--line); }
.trow { display: flex; align-items: center; gap: var(--sp-3); min-height: 42px; padding: 1px 0; }
.trow .grow { flex: 1; display: flex; flex-direction: column; min-width: 0; } .trow .nm { font-weight: var(--fw-semibold); line-height: 1.25; }

.offnote { display: flex; gap: 6px; align-items: center; margin: -2px 0 6px 48px; padding: 4px 10px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--text-2); font-size: var(--fs-footnote); }
.keep { display: flex; gap: 6px; align-items: flex-start; margin: var(--sp-2) 0 4px; }

.ptile { position: relative; display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 12px; border-radius: var(--r-lg); font-weight: var(--fw-semibold); font-size: var(--fs-callout); text-align: left; box-shadow: inset 0 0 0 2px currentColor; }

.ptile .tick .i { width: 14px; height: 14px; stroke-width: 3; color: var(--surface); }
.firstbar { position: absolute; left: 0; right: 0; bottom: 0; padding: var(--sp-3) var(--gutter) calc(var(--safe-bottom) + var(--sp-2)); background: var(--bg); border-top: 1px solid var(--line); }
.tabbar.four { grid-template-columns: repeat(4, 1fr); }
.bg-blur { filter: blur(1.5px); opacity: .9; }

.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 84px; border-radius: var(--r-lg); font-weight: var(--fw-semibold); font-size: var(--fs-callout); text-align: center; line-height: 1.15; padding: 0 4px; }
.tile .i { width: 30px; height: 30px; }
.recent { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--r-md); background: var(--surface-2); font-size: var(--fs-callout); white-space: nowrap; }
.recent b { font-weight: var(--fw-semibold); } .recent .cat { width: 30px; height: 30px; border-radius: 9px; } .muted { color: var(--text-2); }
.row2 { display: flex; gap: var(--sp-2); } .row2 .btn { flex: 1; }
.newcard { box-shadow: inset 0 0 0 1.5px var(--primary), var(--shadow-1); }
.faces { display: flex; justify-content: space-between; margin-top: var(--sp-3); } .face { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; background: var(--feel-tint); color: var(--feel-ink); } .face .i { width: 30px; height: 30px; }
.tl { list-style: none; margin: 0; padding: 0; } .tl li { display: grid; grid-template-columns: 46px 40px 1fr; gap: var(--sp-3); align-items: start; padding: 8px 0; }
.tl time { font-size: var(--fs-footnote); color: var(--text-2); padding-top: 10px; font-weight: var(--fw-medium); } .tl .t { font-weight: var(--fw-semibold); } .tl .s { font-size: var(--fs-callout); color: var(--text-2); }
.section-title { margin-top: var(--sp-5); }
.dark { color: var(--text); }

.dark {
    --bg: #16131a;
    --surface: #211d25;
    --surface-2: #2a2530;
    --surface-3: #352f3b;

    --pain-tint: #3e2329;  --pain-ink: #f5b0b6;
    --meds-tint: #1f3329;  --meds-ink: #a9dabd;
    --note-tint: #34301f;  --note-ink: #e4d4a7;
    --gut-tint: #2b3120;   --gut-ink: #c9d89a;
    --drink-tint: #1b3436; --drink-ink: #a6d8dc;
    --heat-0: #2a2530;
    --heat-1: #4a3428;
    --heat-2: #7a4a34;
    --heat-3: #b0603f;
    --heat-4: #dc7a5c;
    --heat-5: #f0a07f;
    --heat-6: #fbd0b3;
    --on-heat-hi: #2b1309;
    --on-heat-1: #f4eff2;
    --on-heat-2: #f4eff2;
    --on-heat-3: #ffffff;

.cat-period { background: var(--period-tint); color: var(--period-ink); }
.cat-bladder { background: var(--bladder-tint); color: var(--bladder-ink); }
.row + .row { margin-top: 32px; padding-top: 0; border-top: 0; } .row.theme-gap { margin-top: 56px; padding-top: 40px; border-top: 1px solid var(--line); }
.flowgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.flowopt { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 14px; border-radius: var(--r-md); background: var(--surface-2); font-weight: var(--fw-medium); border: 1.5px solid transparent; text-align: left; }

.big small { display: block; font-size: var(--fs-footnote); font-weight: var(--fw-medium); text-align: left; }
.seg3 .on { background: var(--bladder-tint); color: var(--bladder-ink); box-shadow: inset 0 0 0 1.5px var(--bladder-mark); }

.swrow:first-child { border-top: 0; }

.daytotal b { color: var(--text); font-weight: var(--fw-semibold); }

.askcard .grow { flex: 1; line-height: 1.3; } .askcard .grow b { font-weight: var(--fw-semibold); display: block; }
.askcard .x { width: 36px; height: 36px; display: grid; place-items: center; color: var(--text-3); border-radius: 50%; }
.dow { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 11px; font-weight: var(--fw-semibold); color: var(--text-2); margin: 10px 0 2px; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; }

.cal .d.out { opacity: .35; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--fs-footnote); color: var(--text-2); margin-top: 16px; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { display: block; border-radius: 50%; background: var(--period-mark); } .legend i.ring { background: none; box-shadow: inset 0 0 0 2px var(--period-mark); }

.fact.sub { padding: 4px 0 4px 14px; font-size: var(--fs-footnote); color: var(--text-2); border-top: 0; gap: 12px; } .fact.sub b { color: var(--text); }
.legend + .fact { margin-top: 10px; }
.seg { margin: 0 0 var(--sp-3); }
.chart { width: 100%; height: auto; display: block; margin: 10px 0; } .chart text { font-size: 10px; fill: var(--text-2); font-family: var(--font-sans); }
.cardhead { display: flex; align-items: center; gap: 10px; } .cardhead .card-title { flex: 1; }
.dark .frame figcaption { color: inherit; }

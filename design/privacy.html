<body class="board">
<h1 class="board-title">Privacy page and consent v2</h1>
<p class="board-sub">Synthetic data. For <code>feature/age-and-consent</code>. Light row above, the same four frames in dark mode below. Plain words on purpose: short sentences, no legal terms.</p>
<div class="row"><figure class="frame"><div class="phone-wrap"><div class="phone long"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div><main class="content"><div class="stepper" aria-hidden="true"><i></i><i></i><i></i><i></i><i class="on"></i></div>
<h1 class="large-title">Before you start</h1>
<div class="agepill"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#user-round"/></svg><span>MyDaybook is for people aged 13 and over.</span></div>
<p class="para">MyDaybook keeps your diary entries, which can include information about your health. Everything you write is encrypted on your device before it is saved, so only you can read it. The server, and the person running it, only ever see scrambled data.</p>
<p class="para">Besides your encrypted entries, the server keeps only what it needs to run your account: your username, when you joined and last signed in, and a record of this agreement.</p>
<p class="para">You can withdraw this agreement at any time by deleting your account under Me. Your diary and account are then erased. Encrypted backup copies disappear within <b class="num">14 days</b>.</p>
<a href="#" class="readlink"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#shield-check"/></svg>Read how your data is handled<svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg></a>
<label class="agree"><span class="box on"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#check"/></svg></span><span>I am 13 or older. I understand, and I agree to my diary being stored this way.</span></label>
<button class="btn btn-primary btn-block" style="margin-top:var(--sp-4)">Create my diary</button></main><div class="home-indicator"></div></div></div><figcaption><b>1. Sign-up consent, version 2.</b> New: the age line (calm pill, part of the hashed text) and &ldquo;I am 13 or older&rdquo; in the tick-box. The &ldquo;14 days&rdquo; is filled in from the server&rsquo;s backup setting (no longer hard-coded). &ldquo;Read how your data is handled&rdquo; opens the Privacy page (sign-up keeps its state). Button as today: <i>Create my diary</i>.</figcaption></figure><figure class="frame"><div class="phone-wrap"><div class="phone long"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div><main class="content"><header class="page-head"><h1 class="large-title">Me</h1></header>
<div class="card "><div class="card-title">Reminders</div><p class="small muted hint">Get a nudge when a medicine is due.</p><div class="trow"><span class="t grow">Reminders on this phone</span><span class="toggle"></span></div></div>
<div class="card "><div class="card-title">About</div><div class="about"><p><b>MyDaybook</b></p><p class="small muted">Version 0.10.0</p><p>A private place for your health diary. Not a medical device.</p></div></div>
<div class="card "><div class="card-title"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#shield-check"/></svg>Privacy</div><p class="small muted hint">Who can see what, how long things are kept, and your rights.</p><button class="drow">How your data is handled<svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg></button></div>
<div class="card "><div class="card-title"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#file-down"/></svg>Your data</div><p class="small muted hint">Download a copy of everything in your diary.</p><button class="drow">Download my data<svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg></button></div>
<div class="card danger" style="margin-top:var(--sp-6)"><div class="card-title">Delete account</div><div class="about"><p>This erases your diary and your account from the server. It cannot be undone.</p><button class="btn btn-danger btn-block">Delete my account…</button></div></div></main><nav class="tabbar" aria-label="Main"><button class="tab"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#house"/></svg><span>Today</span></button><button class="tab"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#chart-spline"/></svg><span>Trends</span></button><button class="fab" aria-label="Log something"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#plus"/></svg></button><button class="tab"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#pill"/></svg><span>Meds</span></button><button class="tab on"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#user-round"/></svg><span>Me</span></button></nav><div class="home-indicator"></div></div></div><figcaption><b>2. Me, the entry point.</b> A plain <b>Privacy</b> card (no coloured border, so it cannot be mistaken for Delete account), between About and Your data, so the three &ldquo;paper&rdquo; cards (Privacy, Your data, Delete account) sit together at the bottom. About&rsquo;s privacy line can then go.</figcaption></figure><figure class="frame"><div class="phone-wrap"><div class="phone long"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div><main class="content"><div class="nav-head"><span class="back-link"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg>Me</span></div>
<header class="phead"><span class="seal"><svg class="i i-lg" aria-hidden="true"><use href="assets/icons.svg#shield-check"/></svg></span><h1 class="large-title">Your privacy</h1>
<p class="promise">Only you can read your diary. Not even the person who runs this server can.</p></header>
<section class="pblock"><span class="cat cat-feel big"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#notebook-pen"/></svg></span><div><h2>What is kept</h2><p>Your entries and photos, scrambled so only you can open them.</p><p>For your account: your username, when you joined, when you last signed in, and your agreement.</p></div></section>
<section class="pblock"><span class="cat cat-sleep big"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="m2 2 20 20"/></svg></span><div><h2>What the server can see</h2><p>That you have an account. When something is saved, and roughly how big it is.</p><p class="strong">Never what it says.</p></div></section>
<section class="pblock"><span class="cat cat-food big"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#clock"/></svg></span><div><h2>How long things are kept</h2><ul class="keep"><li><b>7 days</b><span>Internet addresses, noted when you sign up or a sign-in goes wrong</span></li><li><b>14 days</b><span>Backup copies, after you delete your account</span></li></ul></div></section>
<section class="pblock"><span class="cat cat-meds big"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#bell"/></svg></span><div><h2>Reminders</h2><p>If you turn them on, the server gets only the times and your time zone. The message goes through Apple or Google and says just “You have a reminder.”</p></div></section>
</main><nav class="tabbar" aria-label="Main"><button class="tab"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#house"/></svg><span>Today</span></button><button class="tab"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#chart-spline"/></svg><span>Trends</span></button><button class="fab" aria-label="Log something"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#plus"/></svg></button><button class="tab"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#pill"/></svg><span>Meds</span></button><button class="tab on"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#user-round"/></svg><span>Me</span></button></nav><div class="home-indicator"></div></div></div><figcaption><b>3. Privacy page, top.</b> One promise, then four blocks. &ldquo;7 days&rdquo; comes from <code>IP_RETENTION_DAYS</code> (0 = not stored; the line then reads &ldquo;Internet addresses are not kept&rdquo;). &ldquo;14 days&rdquo; comes from the backup retention setting (none exists yet in .env, see report).</figcaption></figure><figure class="frame"><div class="phone-wrap"><div class="phone long"><div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sys"><span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="batt"></span></span></div><main class="content"><div class="nav-head"><span class="back-link"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg>Me</span></div>
<h2 class="sec" style="margin-top:var(--sp-3)">Your rights</h2>
<div class="rlist">
<div class="rrow"><span class="bul"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#file-down"/></svg></span><div class="grow"><div class="t">Download my data</div><div class="s">Get a copy of everything in your diary.</div></div><svg class="i i-sm chev" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg></div>

<h2 class="sec">Your agreement</h2>
<div class="card"><p>You agreed on <b>18 Oct 2026</b> · version 1</p><button class="drow" style="margin-top:var(--sp-3)">Read the text you agreed to<svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg></button></div>
<h2 class="sec">Good to know</h2>
<div class="note"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#key-round"/></svg><p><b>If you lose both your passphrase and your recovery key, nobody can open your diary.</b> Not even the person who runs this server. Keep your recovery key somewhere safe.</p></div>
<div class="note plain"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#heart-pulse"/></svg><p>MyDaybook is a diary, not a medical device. It gives no advice and no diagnoses.</p></div>

<h1 class="large-title">Before you start</h1>
<div class="agepill"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#user-round"/></svg><span>MyDaybook is for people aged 13 and over.</span></div>
<p class="para">MyDaybook keeps your diary entries, which can include information about your health. Everything you write is encrypted on your device before it is saved, so only you can read it. The server, and the person running it, only ever see scrambled data.</p>
<p class="para">Besides your encrypted entries, the server keeps only what it needs to run your account: your username, when you joined and last signed in, and a record of this agreement.</p>
<p class="para">You can withdraw this agreement at any time by deleting your account under Me. Your diary and account are then erased. Encrypted backup copies disappear within <b class="num">14 days</b>.</p>
<a href="#" class="readlink"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#shield-check"/></svg>Read how your data is handled<svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#chevron-right"/></svg></a>
<label class="agree"><span class="box on"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#check"/></svg></span><span>I am 13 or older. I understand, and I agree to my diary being stored this way.</span></label>

<header class="phead"><span class="seal"><svg class="i i-lg" aria-hidden="true"><use href="assets/icons.svg#shield-check"/></svg></span><h1 class="large-title">Your privacy</h1>
<p class="promise">Only you can read your diary. Not even the person who runs this server can.</p></header>
<section class="pblock"><span class="cat cat-feel big"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#notebook-pen"/></svg></span><div><h2>What is kept</h2><p>Your entries and photos, scrambled so only you can open them.</p><p>For your account: your username, when you joined, when you last signed in, and your agreement.</p></div></section>
<section class="pblock"><span class="cat cat-sleep big"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="m2 2 20 20"/></svg></span><div><h2>What the server can see</h2><p>That you have an account. When something is saved, and roughly how big it is.</p><p class="strong">Never what it says.</p></div></section>
<section class="pblock"><span class="cat cat-food big"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#clock"/></svg></span><div><h2>How long things are kept</h2><ul class="keep"><li><b>7 days</b><span>Internet addresses, noted when you sign up or a sign-in goes wrong</span></li><li><b>14 days</b><span>Backup copies, after you delete your account</span></li></ul></div></section>
<section class="pblock"><span class="cat cat-meds big"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#bell"/></svg></span><div><h2>Reminders</h2><p>If you turn them on, the server gets only the times and your time zone. The message goes through Apple or Google and says just “You have a reminder.”</p></div></section>

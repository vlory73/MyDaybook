<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dependent profiles and hand-over: MyDaybook mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<style>
:root { --danger: #b3342b; --kid-tint:#d6eee8; --kid-ink:#1d6155; --alt-tint:#f6e6c8; --alt-ink:#7a4f0c; }
body.board { padding: 24px; min-height: 0; width: max-content; }
.board-title { font-size: 22px; font-weight: var(--fw-bold); }
.board-sub { color: var(--text-2); margin: 4px 0 24px; font-size: var(--fs-callout); }
.row { display: flex; gap: 32px; align-items: flex-start; width: max-content; }
.row + .row { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
.frame { margin: 0; width: 375px; }
.frame.dark { color: var(--text); }
.phone-wrap { border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), var(--shadow-2); background: var(--bg); }
.frame figcaption { margin-top: 12px; font-size: var(--fs-footnote); color: var(--text-2); line-height: 1.4; }
.frame figcaption b { color: var(--text); }
.phone { margin: 0; }
.form-row { display: flex; gap: var(--sp-2); } .form-row .field { flex: 1; }
.field.sel { justify-content: space-between; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: var(--sp-4); }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; border-radius: var(--r-md); font-size: var(--fs-caption); color: var(--text-2); }
.day b { font-size: var(--fs-callout); color: var(--text); font-weight: var(--fw-semibold); }
.day i { width: 5px; height: 5px; border-radius: 50%; background: var(--primary); opacity: .55; }
.day.today { background: var(--text); color: var(--bg); } .day.today b { color: var(--bg); } .day.today i { background: var(--bg); opacity: 1; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 46px 40px 1fr; gap: var(--sp-3); align-items: start; padding: 10px 0; }
.tl time { font-size: var(--fs-footnote); color: var(--text-2); padding-top: 10px; font-weight: var(--fw-medium); }
.tl .t { font-weight: var(--fw-semibold); } .tl .s { font-size: var(--fs-callout); color: var(--text-2); }
.tag { display: inline-block; font-size: var(--fs-caption); font-weight: var(--fw-semibold); padding: 2px 8px; border-radius: var(--r-full); background: var(--surface-2); color: var(--text-2); margin-top: 4px; }
.grow { flex: 1; }
.pav { width: 28px; height: 28px; border-radius: var(--r-full); display: inline-grid; place-items: center; flex: none; font-size: 14px; font-weight: var(--fw-bold); background: var(--feel-tint); color: var(--feel-ink); }
.pav.kid { background: var(--kid-tint); color: var(--kid-ink); box-shadow: inset 0 0 0 1.5px var(--kid-ink); }
.pav.alt { background: var(--alt-tint); color: var(--alt-ink); }
.pav.plus { background: var(--primary-soft); color: var(--primary-press); }
.pav.lg { width: 38px; height: 38px; font-size: 17px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px 0 6px; border-radius: var(--r-full); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-1); font-weight: var(--fw-semibold); font-size: var(--fs-callout); }
.pchip .i-xs { margin-top: 0; color: var(--text-2); }
.band { display: flex; align-items: center; gap: var(--sp-3); padding: 8px var(--gutter); background: var(--kid-tint); color: var(--kid-ink); border-bottom: 2px solid var(--kid-ink); }
.band b { display: block; font-size: var(--fs-body); line-height: 1.2; } .band span:not(.pav) { font-size: var(--fs-caption); }
.band-btn { background: color-mix(in srgb, var(--kid-ink) 14%, transparent); color: var(--kid-ink); min-height: 32px; }
.prow { display: flex; align-items: center; gap: var(--sp-3); min-height: 60px; padding: 8px var(--sp-3); border-radius: var(--r-md); }
.prow:has(.tick) { background: var(--kid-tint); box-shadow: inset 0 0 0 1.5px var(--kid-ink); }
.prow + .prow { margin-top: 6px; }
.prow .pav { width: 38px; height: 38px; font-size: 17px; }
.prow .t { font-weight: var(--fw-semibold); }
.tick { color: var(--kid-ink); display: grid; place-items: center; }
.consent { display: flex; gap: var(--sp-3); align-items: flex-start; margin: var(--sp-4) 0; padding: var(--sp-3); background: var(--surface-2); border-radius: var(--r-md); }
.cbox { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--primary); display: grid; place-items: center; flex: none; margin-top: 2px; }
.cbox.on { background: var(--primary); color: var(--on-primary); }
.link { color: var(--primary-press); font-weight: var(--fw-semibold); display: inline-block; margin-top: 4px; }
.grow-row { display: flex; align-items: center; gap: var(--sp-3); padding: 10px 0; } .grow-row + .grow-row { border-top: 1px solid var(--line); }
.grow-row .t { font-weight: var(--fw-semibold); }
.btn.disabled { color: var(--text-3); opacity: .75; }
.btn-danger { background: transparent; color: var(--danger); box-shadow: inset 0 0 0 1.5px var(--danger); }
.card.danger { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 35%, transparent); }
.words { display: flex; align-items: center; justify-content: center; gap: 8px; padding: var(--sp-4) var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); box-shadow: inset 0 0 0 1.5px var(--line); font-size: var(--fs-body); font-weight: var(--fw-bold); flex-wrap: nowrap; }
.words i { color: var(--text-3); font-style: normal; }
.code { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 6px; margin: var(--sp-3) 0 var(--sp-4); }
.code span { text-align: center; padding: 12px 0; border-radius: var(--r-sm); background: var(--surface-2); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; font-weight: 700; letter-spacing: .04em; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--sp-3); }
.steps li { display: flex; gap: var(--sp-3); align-items: flex-start; font-size: var(--fs-callout); }
.steps b { width: 26px; height: 26px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-press); display: grid; place-items: center; flex: none; font-size: 14px; }
.note { display: flex; gap: var(--sp-2); align-items: flex-start; margin-top: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); background: var(--note-tint); color: var(--note-ink); font-size: var(--fs-callout); }
.note .i { margin-top: 2px; }
.hero { width: 64px; height: 64px; border-radius: 20px; background: var(--primary-soft); color: var(--primary-press); display: grid; place-items: center; margin: var(--sp-4) auto; }
.steps-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: var(--sp-2); }
.steps-dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--surface-3); } .steps-dots i.on { background: var(--primary); width: 22px; border-radius: 4px; }
.codefield { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 20px; letter-spacing: .08em; font-weight: 600; }
.caret { width: 2px; height: 24px; background: var(--primary); margin-left: 2px; }
.frame.dark figcaption { color: #5f5666; } .frame.dark figcaption b { color: #2a2430; }

/* Dark mode forced for the second row (same values as tokens.css dark block) */
.dark {
    --bg: #16131a;
    --surface: #211d25;
    --surface-2: #2a2530;
    --surface-3: #352f3b;
    --line: #3b3441;
    --text: #f4eff2;
    --text-2: #bdb3c1;
    --text-3: #978c9b;
    --primary: #f08f68;
    --primary-press: #f6a585;
    --on-primary: #2b1309;
    --primary-soft: #43271d;
    --focus: #8cbcf0;
    --scrim: rgb(0 0 0 / 0.55);
    --food-tint: #3b2a1b;  --food-ink: #f5c591;
    --feel-tint: #2e2843;  --feel-ink: #cfc1f6;
    --sleep-tint: #252c45; --sleep-ink: #b5c3f2;
    --measure-tint: #1e3141; --measure-ink: #a8d2ef;
    --pain-tint: #3e2329;  --pain-ink: #f5b0b6;
    --meds-tint: #1f3329;  --meds-ink: #a9dabd;
    --note-tint: #34301f;  --note-ink: #e4d4a7;
    --gut-tint: #2b3120;   --gut-ink: #c9d89a;
    --heat-0: #2a2530;
    --heat-1: #4a3428;
    --heat-2: #7a4a34;
    --heat-3: #b0603f;
    --heat-4: #dc7a5c;
    --heat-5: #f0a07f;
    --heat-6: #fbd0b3;
    --on-heat-hi: #2b1309;
    --on-heat-1: #f4eff2;
    --on-heat-2: #f4eff2;
    --on-heat-3: #ffffff;
    --on-heat-4: #16101a;
    --on-heat-5: #16101a;
    --shadow-1: 0 1px 2px rgb(0 0 0 / 0.3);
    --shadow-2: 0 6px 18px rgb(0 0 0 / 0.45);
    --shadow-fab: 0 6px 18px rgb(240 143 104 / 0.25), 0 2px 4px rgb(0 0 0 / 0.4);
  --danger: #f2877f; --kid-tint:#17342f; --kid-ink:#9fdccf; --alt-tint:#3a2e1c; --alt-ink:#f0c88a; }
</style>
</head>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log bowel movement: MyDaybook mockup</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="mockup.css">
<style>
.tri { display: flex; align-items: center; gap: var(--sp-3); padding: 6px 0; }
.tri .what { flex: 1; display: flex; align-items: center; gap: 10px; font-weight: var(--fw-semibold); }
.tri .segmented { flex: none; width: 190px; } .tri .segmented button { min-height: 34px; font-size: var(--fs-footnote); }
.tri .segmented button.yes { background: var(--food-tint); color: var(--food-ink); font-weight: var(--fw-bold); box-shadow: none; }
.row2 { display: flex; gap: var(--sp-2); }
.row2 .btn { flex: 1; }

.types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.types button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 2px 8px; border-radius: var(--r-md);
  background: var(--surface-2); color: var(--gut-ink); font-size: var(--fs-caption); }
.types button b { color: var(--text); font-size: var(--fs-callout); }
.types button span { color: var(--text-2); }
.types button.on { background: var(--gut-tint); box-shadow: inset 0 0 0 2px var(--gut-ink); }
</style>
</head>
<body>
<div class="phone">
<div class="statusbar" aria-hidden="true"><span>9:41</span><span class="sys">
<span class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span>
<span class="batt"></span></span></div>

<div class="scrim" style="background:var(--bg)"></div>
<section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh" style="top:52px; overflow:hidden">
  <div class="grabber"></div>
  <div class="sheet-head" style="margin-bottom:var(--sp-2)"><button class="icon-btn" aria-label="Back"><svg class="i" aria-hidden="true"><use href="assets/icons.svg#chevron-left"/></svg></button>
    <h2 id="sh" style="flex:1; margin-left:4px">Bowel movement</h2><span class="time-chip"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#clock"/></svg> 07:40</span></div>
  
  <p class="label" style="margin-top:0">Type <span class="hint">based on the Bristol scale</span></p>
  <div class="types"><button class="" aria-label="Type 1, Hard lumps"><svg viewBox="0 0 40 26" width="44" height="28" fill="currentColor" aria-hidden="true"><circle cx="10" cy="14" r="4"/><circle cx="20" cy="11" r="3.5"/><circle cx="29" cy="15" r="4"/><circle cx="18" cy="20" r="3"/></svg><b>1</b><span>Hard lumps</span></button><button class="" aria-label="Type 2, Lumpy"><svg viewBox="0 0 40 26" width="44" height="28" fill="currentColor" aria-hidden="true"><path d="M6 15c0-4 3-6 6-5 2-3 6-3 8 0 3-2 7-1 8 2 3 1 4 5 2 7-1 3-5 3-7 2-2 2-6 2-8 0-3 1-7 0-9-6z"/></svg><b>2</b><span>Lumpy</span></button><button class="" aria-label="Type 3, Cracked"><svg viewBox="0 0 40 26" width="44" height="28" fill="currentColor" aria-hidden="true"><rect x="5" y="9" width="30" height="11" rx="5.5"/><path d="M13 9v3M20 20v-3M27 9v3" stroke="var(--gut-tint)" stroke-width="1.6"/></svg><b>3</b><span>Cracked</span></button><button class="on" aria-label="Type 4, Smooth"><svg viewBox="0 0 40 26" width="44" height="28" fill="currentColor" aria-hidden="true"><path d="M6 17c4-7 10-7 14-3s10 4 14-3" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round"/></svg><b>4</b><span>Smooth</span></button><button class="" aria-label="Type 5, Soft pieces"><svg viewBox="0 0 40 26" width="44" height="28" fill="currentColor" aria-hidden="true"><ellipse cx="10" cy="15" rx="5" ry="4"/><ellipse cx="21" cy="12" rx="5" ry="4"/><ellipse cx="30" cy="17" rx="5" ry="4"/></svg><b>5</b><span>Soft pieces</span></button><button class="" aria-label="Type 6, Mushy"><svg viewBox="0 0 40 26" width="44" height="28" fill="currentColor" aria-hidden="true"><path d="M5 18c2-6 6-4 8-7 3 3 5-1 8 2 2-3 6-1 7 1 3 0 6 2 6 5-4 3-25 3-29-1z"/></svg><b>6</b><span>Mushy</span></button><button class="" aria-label="Type 7, Watery"><svg viewBox="0 0 40 26" width="44" height="28" fill="currentColor" aria-hidden="true"><path d="M12 6c3 5 5 7 5 10a5 5 0 0 1-10 0c0-3 2-5 5-10zM27 9c2.5 4 4 6 4 8.5a4 4 0 0 1-8 0c0-2.5 1.5-4.5 4-8.5z"/></svg><b>7</b><span>Watery</span></button></div>
  <p class="label">Anything else? <span class="hint">optional</span></p>
  <div class="chip-row"><span class="chip">Urgent</span><span class="chip">Straining</span><span class="chip">Pain</span><span class="chip">Not finished</span><span class="chip">Blood seen</span><span class="chip">Mucus</span></div>
  <p class="label">Note</p>
  <div class="field">Optional</div>
  <button class="btn btn-primary btn-block" style="margin-top:var(--sp-5)">Save</button>
  <p class="footnote-lock"><svg class="i i-sm" aria-hidden="true"><use href="assets/icons.svg#lock"/></svg> Only you can see this. Not even the server can.</p>

</section>

<div class="home-indicator"></div>
</div>
</body>
</html>

<style>

body.board { padding: 24px; min-height: 0; width: max-content; background: var(--surface-3); }
.board-title { font-size: 22px; font-weight: var(--fw-bold); }
.board-sub { color: var(--text-2); margin: 4px 0 24px; font-size: var(--fs-callout); }
.row { display: flex; gap: 32px; align-items: flex-start; width: max-content; }
.row + .row { margin-top: 40px; padding-top: 32px; border-top: 1px solid var(--line); }
.frame { margin: 0; width: 375px; }
.phone-wrap { border-radius: 36px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), var(--shadow-2); background: var(--bg); }
.frame figcaption, .a4fig figcaption { margin-top: 12px; font-size: var(--fs-footnote); color: var(--text-2); line-height: 1.4; }
.frame figcaption b, .a4fig figcaption b { color: var(--text); }
.frame.dark figcaption { color: #5f5666; } .frame.dark figcaption b { color: #2a2430; }
.frame
.sync-pill { display:inline-flex; align-items:center; gap:8px; min-height:32px; padding:0 12px; border-radius:var(--r-full); background:var(--surface-2); border:1px solid var(--line); color:var(--text); font-size:var(--fs-footnote); font-weight:var(--fw-semibold); }
.unsynced { display:inline-flex; align-items:center; gap:5px; margin-top:4px; font-size:var(--fs-caption); font-weight:var(--fw-medium); color:var(--text-2); }
.notice { display:flex; gap:10px; align-items:flex-start; text-align:left; margin-top:var(--sp-5); padding:12px 14px; border-radius:var(--r-md); background:var(--measure-tint); color:var(--measure-ink); font-size:var(--fs-callout); font-weight:var(--fw-medium); }
.notice .i { margin-top:1px; }
.lnk { color:var(--primary-press); font-weight:var(--fw-medium); font-size:var(--fs-callout); }
.row-line { display:flex; gap:8px; align-items:center; margin-top:var(--sp-3); }
.row-line.warn { color:var(--note-ink); }
.variant { margin-top:var(--sp-2); font-size:var(--fs-caption); font-weight:var(--fw-semibold); color:var(--text-2); text-transform:uppercase; letter-spacing:.05em; }
.toggle-row { display:flex; justify-content:space-between; align-items:center; min-height:44px; margin-top:var(--sp-2); }
.toggle-row.off > span:first-child { color:var(--text-3); }
.switch { width:51px; height:31px; border-radius:var(--r-full); background:var(--surface-3); position:relative; opacity:.6; }
.switch i { position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:var(--surface); box-shadow:var(--shadow-1); }
.inl { display:inline-flex; vertical-align:middle; }
.danger-text { color:var(--pain-ink); background:transparent; }
.photo-row { display:flex; gap:var(--sp-3); align-items:flex-end; margin-top:var(--sp-3); }
.photo-row .card-sub { padding-bottom:4px; }
.pthumb { position:relative; flex:none; width:150px; height:96px; border-radius:var(--r-md); overflow:hidden;
  background: radial-gradient(circle at 30% 40%, #f3d2a2, transparent 45%), radial-gradient(circle at 70% 60%, #b9506a, transparent 35%), radial-gradient(circle at 55% 30%, #6c5aa8, transparent 25%), linear-gradient(135deg, #f5e6cf, #e8cfae); }
.pbadge { position:absolute; left:0; right:0; bottom:0; display:flex; gap:5px; align-items:center; justify-content:center; padding:5px 6px; background:rgb(42 36 48 / .86); color:#fff; font-size:var(--fs-caption); font-weight:var(--fw-semibold); }
.tri { display:flex; align-items:center; gap:var(--sp-3); padding:6px 0; }
.tri .what { flex:1; display:flex; align-items:center; gap:10px; font-weight:var(--fw-semibold); }
.tri .segmented { flex:none; width:190px; } .tri .segmented button { min-height:34px; font-size:var(--fs-footnote); }
.tri .segmented button.yes { background:var(--food-tint); color:var(--food-ink); font-weight:var(--fw-bold); box-shadow:none; }
.dark { color: var(--text); }
.statusbar { position: relative; z-index: 60; }
.btnrow { display: flex; gap: 8px; margin-top: var(--sp-3); flex-wrap: wrap; }
.ep-line { font-size: var(--fs-footnote); color: var(--text-2); margin-top: 2px; font-weight: var(--fw-medium); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 46px 40px 1fr; gap: var(--sp-3); align-items: start; padding: 10px 0; }
.tl time { font-size: var(--fs-footnote); color: var(--text-2); padding-top: 10px; font-weight: var(--fw-medium); }
.tl .t { font-weight: var(--fw-semibold); } .tl .s { font-size: var(--fs-callout); color: var(--text-2); }
.faux { border: 1.5px dashed var(--line); border-radius: var(--r-md); color: var(--text-3); font-size: var(--fs-footnote); display: grid; place-items: center; text-align: center; padding: 10px; }
.hd-head { display: flex; width: 100%; justify-content: space-between; align-items: center; min-height: 48px; margin-top: var(--sp-3); font-weight: var(--fw-semibold); }
.hd-body { border: 1px solid var(--line); border-radius: var(--r-md); padding: var(--sp-2) var(--sp-4) var(--sp-4); }
.pair { display: flex; gap: var(--sp-2); }
.hint { margin: var(--sp-2) 0 0; }
.a4fig { margin: 0; width: 760px; }
.a4 { background: #fff; color: #111; padding: 24px 28px; box-shadow: 0 0 0 1px #ccc, 0 6px 18px rgb(0 0 0 / .15); font: 12px/1.3 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
.a4 h3 { font-size: 16px; margin-bottom: 8px; }
.a4 table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.a4 th, .a4 td { border: 1px solid #888; padding: 6px; text-align: center; font-size: 12px; vertical-align: middle; height: 44px; }
.a4 thead th { background: #eee; font-weight: 400; height: 38px; } .a4 thead th b { display: block; font-size: 13px; } .a4 thead th span { font-size: 12px; color: #444; }
.a4 .corner { width: 150px; background: #fff; border-top-color: transparent; border-left-color: transparent; }
.a4 tbody th { text-align: left; font-weight: 600; background: #f6f6f6; padding-left: 8px; }
.a4 .n { display: inline-block; width: 18px; color: #666; font-weight: 400; }
.a4 td.none { background: #f4f4f4; color: #555; font-style: italic; }
.a4 .fn { font-size: 12px; color: #333; margin-top: 10px; font-style: italic; }

    --bg: #16131a;
    --surface: #211d25;
    --surface-2: #2a2530;
    --surface-3: #352f3b;

    --sleep-tint: #252c45; --sleep-ink: #b5c3f2;
    --measure-tint: #1e3141; --measure-ink: #a8d2ef;
    --pain-tint: #3e2329;  --pain-ink: #f5b0b6;
    --meds-tint: #1f3329;  --meds-ink: #a9dabd;
    --note-tint: #34301f;  --note-ink: #e4d4a7;
    --gut-tint: #2b3120;   --gut-ink: #c9d89a;
    --heat-0: #2a2530;
    --heat-1: #4a3428;
    --heat-2: #7a4a34;
    --heat-3: #b0603f;
    --heat-4: #dc7a5c;
    --heat-5: #f0a07f;
    --heat-6: #fbd0b3;
    --on-heat-hi: #2b1309;
    --on-heat-1: #f4eff2;
    --on-heat-2: #f4eff2;
    --on-heat-3: #ffffff;
    --on-heat-4: #16101a;
    --on-heat-5: #16101a;
    --shadow-1: 0 1px 2px rgb(0 0 0 / 0.3);

}
</style>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pain episodes: MyDaybook mockup</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="mockup.css"><style>
body{background:var(--surface-3);padding:24px 0 40px}
.row{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:0 24px;width:max-content;margin:0 auto}
.fr{margin:0}.fr figcaption{font:600 14px/1.3 var(--font-sans);color:var(--text);margin:0 0 8px 4px}
.fr .phone{margin:0;border-radius:28px;box-shadow:var(--shadow-2)}
.link{color:var(--primary);font-weight:var(--fw-semibold);font-size:var(--fs-callout);min-height:36px;display:inline-flex;align-items:center;gap:4px;padding:0 4px}
.btnrow{display:flex;gap:8px;margin-top:var(--sp-3);flex-wrap:wrap}
.ep-line{font-size:var(--fs-footnote);color:var(--text-2);margin-top:2px;font-weight:var(--fw-medium)}
.moods{display:flex;justify-content:space-between;margin-top:var(--sp-3)}.mood{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.tl{list-style:none;margin:0;padding:0}.tl li{display:grid;grid-template-columns:46px 40px 1fr;gap:var(--sp-3);align-items:start;padding:10px 0}
.tl time{font-size:var(--fs-footnote);color:var(--text-2);padding-top:10px;font-weight:var(--fw-medium)}
.tl .t{font-weight:var(--fw-semibold)}.tl .s{font-size:var(--fs-callout);color:var(--text-2)}
.epchip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;min-height:28px;padding:0 10px;border-radius:var(--r-full);background:var(--surface-2);color:var(--text);border:1px solid var(--line);font-size:var(--fs-footnote);font-weight:var(--fw-semibold)}
.note{font-size:var(--fs-footnote);color:var(--text-2);margin-top:var(--sp-3)}
.faux{border:1.5px dashed var(--line);border-radius:var(--r-md);color:var(--text-3);font-size:var(--fs-footnote);display:grid;place-items:center;text-align:center;padding:10px;margin-top:var(--sp-3)}
.eprow{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:var(--r-md);padding:8px 8px 8px 16px;min-height:56px}
.eprow .v{font-weight:var(--fw-semibold)}
.strip{display:flex;gap:6px;justify-content:flex-start}.dd{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:34px}
.dd small{font-size:11px;color:var(--text-2)}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:var(--fw-bold);font-size:var(--fs-callout)}
.dot.h1{background:var(--heat-1);color:var(--on-heat-1)}.dot.h2{background:var(--heat-2);color:var(--on-heat-2)}.dot.h3{background:var(--heat-3);color:var(--on-heat-3)}
.dot.h4{background:var(--heat-4);color:var(--on-heat-4)}.dot.h5{background:var(--heat-5);color:var(--on-heat-5)}
.dot.empty{background:none;border:1.5px solid var(--text-3)}
.elist{list-style:none;margin:0;padding:0}.elist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-top:1px solid var(--line)}
.elist li:first-child{border-top:0}.when{font-size:var(--fs-footnote);color:var(--text-2)}.what{font-weight:var(--fw-semibold);font-size:var(--fs-callout)}
.quietrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:var(--sp-3)}.quietrow p{flex:1}
.range{font-size:var(--fs-callout);color:var(--text-2);margin:var(--sp-2) 2px 0}
.segmented{display:flex;background:var(--surface-2);border-radius:999px;padding:3px}
.eps{list-style:none;margin:var(--sp-3) 0 0;padding:0}.eps li{padding:12px 0;border-top:1px solid var(--line)}.eps li:first-child{border-top:0;padding-top:4px}
.en{font-weight:var(--fw-semibold)}.em{font-size:var(--fs-callout);color:var(--text-2)}
.foot{font-size:var(--fs-footnote);color:var(--text-2);margin-top:var(--sp-2);border-top:1px solid var(--line);padding-top:var(--sp-3)}
</style></head>

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, licences, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (Prettier, ESLint, no hard-coded strings)
        run: npm run lint
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Licence check
        run: npm run licenses
      - name: Dependency audit
        run: npm run audit
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Chromium + WebKit, phone viewport)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Playwright
        run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: Something is wrong
description: Tell us about something that doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you! Please **don't write any health details** here (no symptoms, medicines or diary content). Just describe what the app did.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What were you doing, and what went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: false
  - type: dropdown
    id: device
    attributes:
      label: Where did it happen?
      options:
        - iPhone
        - Android phone
        - Computer
        - Other / not sure
    validations:
      required: false
